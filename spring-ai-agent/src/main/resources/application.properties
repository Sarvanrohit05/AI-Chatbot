spring.application.name=spring-ai-agent

# Gemini
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
spring.ai.google.genai.chat.options.model=gemini-3.8-flash

# Groq
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.options.model=openai/gpt-oss-20b

# Ollama
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2

# Disable automatic ChatClient
# because we have multiple ChatModels
spring.ai.chat.client.enabled=false


spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/spring_ai_agent
spring.datasource.username=root
spring.datasource.password=rootpassword

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true